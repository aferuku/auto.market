
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>AutoMarket</title>

<style>
body {font-family:Arial;margin:0;background:#f2f2f2}
header {background:#111;color:#fff;padding:20px;text-align:center}
.brands button {margin:4px;padding:8px 14px;cursor:pointer}
.cars {display:flex;flex-wrap:wrap;justify-content:center}
.car {
  background:#fff;width:240px;margin:8px;
  border-radius:6px;box-shadow:0 0 6px rgba(0,0,0,.1)
}
.car img {width:100%;height:140px;object-fit:cover}
.car-info {padding:8px;text-align:center}
.price {color:green;font-weight:bold}
footer {background:#111;color:#fff;text-align:center;padding:15px;margin-top:20px}
</style>
</head>

<body>

<header>
<h1>AutoMarket</h1>
<p>WELCOME</p>
</header>

<div class="brands" id="brands" style="text-align:center"></div>
<div class="cars" id="cars"></div>

<footer>
© 2026 Auto Market. Të gjitha të drejtat e rezervuara.
</footer>

<script>
const data = {
  "Audi": [
    "Audi A1","Audi A3","Audi A4","Audi A5","Audi A6","Audi A7","Audi A8",
    "Audi Q2","Audi Q3","Audi Q5","Audi Q7","Audi Q8",
    "Audi TT","Audi R8",
    "Audi RS3","Audi RS4","Audi RS5","Audi RS6","Audi RS7",
    "Audi e-tron","Audi e-tron GT"
  ],

  "BMW": [
    "BMW 1 Series","BMW 2 Series","BMW 3 Series","BMW 4 Series",
    "BMW 5 Series","BMW 6 Series","BMW 7 Series","BMW 8 Series",
    "BMW X1","BMW X2","BMW X3","BMW X4","BMW X5","BMW X6","BMW X7",
    "BMW Z4","BMW i3","BMW i4","BMW i7","BMW i8",
    "BMW M2","BMW M3","BMW M4","BMW M5","BMW M8"
  ],

  "Mercedes": [
    "Mercedes A-Class","Mercedes B-Class","Mercedes C-Class","Mercedes E-Class","Mercedes S-Class",
    "Mercedes CLA","Mercedes CLS",
    "Mercedes GLA","Mercedes GLB","Mercedes GLC","Mercedes GLE","Mercedes GLS",
    "Mercedes G-Class",
    "Mercedes SL","Mercedes AMG GT",
    "Mercedes EQA","Mercedes EQB","Mercedes EQC","Mercedes EQE","Mercedes EQS"
  ],

  "Volkswagen": [
    "Volkswagen Polo","Volkswagen Golf","Volkswagen Passat","Volkswagen Arteon",
    "Volkswagen Jetta","Volkswagen Tiguan","Volkswagen Touareg","Volkswagen T-Roc",
    "Volkswagen Taigo","Volkswagen Touran","Volkswagen Sharan",
    "Volkswagen ID.3","Volkswagen ID.4","Volkswagen ID.5","Volkswagen ID.Buzz"
  ],

  "Toyota": [
    "Toyota Yaris","Toyota Corolla","Toyota Camry","Toyota Avensis",
    "Toyota Prius","Toyota C-HR","Toyota RAV4","Toyota Highlander",
    "Toyota Land Cruiser","Toyota Hilux","Toyota Supra","Toyota GR86"
  ],

  "Ford": [
    "Ford Fiesta","Ford Focus","Ford Mondeo","Ford Mustang",
    "Ford Puma","Ford Kuga","Ford Edge","Ford Explorer",
    "Ford Ranger","Ford Transit"
  ],

  "Honda": [
    "Honda Jazz","Honda Civic","Honda Accord",
    "Honda HR-V","Honda CR-V","Honda Pilot",
    "Honda NSX","Honda e"
  ],

  "Hyundai": [
    "Hyundai i10","Hyundai i20","Hyundai i30","Hyundai Elantra","Hyundai Sonata",
    "Hyundai Kona","Hyundai Tucson","Hyundai Santa Fe",
    "Hyundai Ioniq","Hyundai Ioniq 5","Hyundai Ioniq 6"
  ],

  "Kia": [
    "Kia Picanto","Kia Rio","Kia Ceed","Kia Cerato","Kia Optima",
    "Kia Stinger","Kia Sportage","Kia Sorento","Kia Telluride",
    "Kia EV6","Kia EV9"
  ],

  "Porsche": [
    "Porsche 718 Cayman","Porsche 718 Boxster",
    "Porsche 911","Porsche Panamera",
    "Porsche Macan","Porsche Cayenne",
    "Porsche Taycan"
  ]
};

const brands = Object.keys(data);
let currentBrand = brands[0];

const brandsBox = document.getElementById("brands");
brands.forEach(b => {
  const btn = document.createElement("button");
  btn.innerText = b;
  btn.onclick = () => showBrand(b);
  brandsBox.appendChild(btn);
});

function showBrand(brand) {
  currentBrand = brand;
  render();
}

function render() {
  const box = document.getElementById("cars");
  box.innerHTML = "";
  data[currentBrand].forEach((model, i) => {
    box.innerHTML += `
      <div class="car">
        <img src="https://placehold.co/400x250?text=${currentBrand}">
        <div class="car-info">
          <b>${model}</b><br>
          <span class="price">${20.000 + i*1200} €</span>
        </div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
