<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Auto Market</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .cars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .car {
            background: white;
            width: 300px;
            margin: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .car img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .car-info {
            padding: 15px;
        }
        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }
        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>Auto Market</h1>
    <p>Shitje makinash të reja dhe të përdorura</p>
</header>

<section class="cars">

    <div class="car">
        <img src="https://images.unsplash.com/photo-1549924231-f129b911e442" alt="BMW">
        <div class="car-info">
            <h3>BMW X5 2019</h3>
            <p>Naftë • Automatike • 120,000 km</p>
            <p class="price">25,000 €</p>
            <button>Kontakto shitësin</button>
        </div>
    </div>

    <div class="car">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="Audi">
        <div class="car-info">
            <h3>Audi A4 2020</h3>
            <p>Benzinë • Manuale • 80,000 km</p>
            <p class="price">18,500 €</p>
            <button>Kontakto shitësin</button>
        </div>
    </div>

    <div class="car">
        <img src="https://images.unsplash.com/photo-1617814076231-0d1a3a89ce11" alt="Mercedes">
        <div class="car-info">
            <h3>Mercedes C Class</h3>
            <p>Naftë • Automatike • 95,000 km</p>
            <p class="price">22,000 €</p>
            <button>Kontakto shitësin</button>
        </div>
    </div>

</section>

<footer>
    <p>© 2026 Auto Market | Tel: +383 44 123 456</p>
</footer>

</body>
</html>
